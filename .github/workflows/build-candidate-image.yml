name: Build disposable candidate image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/chrisknvidia/skillevaluator-candidate-100
      SOURCE_SHA: d8e4e82878a95c44a1881c9e200fb8e568c63923
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: NVIDIA/SkillEvaluator
          ref: d8e4e82878a95c44a1881c9e200fb8e568c63923
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build exact candidate source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ci/Dockerfile.tier1
          labels: |
            org.opencontainers.image.source=https://github.com/chrisknvidia/skillevaluator-ci-release-100
            org.opencontainers.image.revision=d8e4e82878a95c44a1881c9e200fb8e568c63923
            org.opencontainers.image.description=Disposable SkillEvaluator 1.0 qualification candidate
          tags: ghcr.io/chrisknvidia/skillevaluator-candidate-100:sha-d8e4e82878a95c44a1881c9e200fb8e568c63923
          load: true
          provenance: false
          cache-to: type=gha,scope=candidate-tier1,mode=max,ignore-error=true
      - name: Exercise actual scanner and selection matrix
        run: python3 ci/smoke_image.py --image "$IMAGE:sha-$SOURCE_SHA" --output "$RUNNER_TEMP/candidate-verification"
      - name: Push disposable personal image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/personal-registry"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$SOURCE_SHA" | tee "$RUNNER_TEMP/candidate-verification/push.log"
          docker inspect "$IMAGE:sha-$SOURCE_SHA" > "$RUNNER_TEMP/candidate-verification/image-inspect.json"
      - name: Retain real candidate image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disposable-candidate-image-evidence
          path: ${{ runner.temp }}/candidate-verification
          retention-days: 14
